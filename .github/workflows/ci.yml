name: CI

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.lane }} / ${{ matrix.stage }}
    runs-on: ubuntu-latest
    # The stage runner's 15/20-minute external group boundary owns timeout cleanup.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: locked baseline
            stage: core
            bun-version: 1.3.14
            pi-version: ""
            pi-graph: '{"@earendil-works/pi-agent-core":"0.84.4","@earendil-works/pi-ai":"0.84.4","@earendil-works/pi-client":"0.84.4","@earendil-works/pi-coding-agent":"0.84.4","@earendil-works/pi-protocol":"0.84.4","@earendil-works/pi-telemetry":"0.84.4","@earendil-works/pi-tui":"0.84.4"}'
          - lane: locked baseline
            stage: phase0
            bun-version: 1.3.14
            pi-version: ""
            pi-graph: '{"@earendil-works/pi-agent-core":"0.84.4","@earendil-works/pi-ai":"0.84.4","@earendil-works/pi-client":"0.84.4","@earendil-works/pi-coding-agent":"0.84.4","@earendil-works/pi-protocol":"0.84.4","@earendil-works/pi-telemetry":"0.84.4","@earendil-works/pi-tui":"0.84.4"}'
          - lane: locked baseline
            stage: reaper
            bun-version: 1.3.14
            pi-version: ""
            pi-graph: '{"@earendil-works/pi-agent-core":"0.84.4","@earendil-works/pi-ai":"0.84.4","@earendil-works/pi-client":"0.84.4","@earendil-works/pi-coding-agent":"0.84.4","@earendil-works/pi-protocol":"0.84.4","@earendil-works/pi-telemetry":"0.84.4","@earendil-works/pi-tui":"0.84.4"}'
          - lane: locked baseline
            stage: sessionTail
            bun-version: 1.3.14
            pi-version: ""
            pi-graph: '{"@earendil-works/pi-agent-core":"0.84.4","@earendil-works/pi-ai":"0.84.4","@earendil-works/pi-client":"0.84.4","@earendil-works/pi-coding-agent":"0.84.4","@earendil-works/pi-protocol":"0.84.4","@earendil-works/pi-telemetry":"0.84.4","@earendil-works/pi-tui":"0.84.4"}'
          - lane: current compatibility
            stage: core
            bun-version: 1.4.2
            pi-version: 0.85.1
            pi-graph: '{"@earendil-works/pi-agent-core":"0.85.1","@earendil-works/pi-ai":"0.85.1","@earendil-works/pi-client":"0.85.1","@earendil-works/pi-coding-agent":"0.85.1","@earendil-works/pi-protocol":"0.85.1","@earendil-works/pi-telemetry":"0.85.1","@earendil-works/pi-tui":"0.85.1"}'
          - lane: current compatibility
            stage: phase0
            bun-version: 1.4.2
            pi-version: 0.85.1
            pi-graph: '{"@earendil-works/pi-agent-core":"0.85.1","@earendil-works/pi-ai":"0.85.1","@earendil-works/pi-client":"0.85.1","@earendil-works/pi-coding-agent":"0.85.1","@earendil-works/pi-protocol":"0.85.1","@earendil-works/pi-telemetry":"0.85.1","@earendil-works/pi-tui":"0.85.1"}'
          - lane: current compatibility
            stage: reaper
            bun-version: 1.4.2
            pi-version: 0.85.1
            pi-graph: '{"@earendil-works/pi-agent-core":"0.85.1","@earendil-works/pi-ai":"0.85.1","@earendil-works/pi-client":"0.85.1","@earendil-works/pi-coding-agent":"0.85.1","@earendil-works/pi-protocol":"0.85.1","@earendil-works/pi-telemetry":"0.85.1","@earendil-works/pi-tui":"0.85.1"}'
          - lane: current compatibility
            stage: sessionTail
            bun-version: 1.4.2
            pi-version: 0.85.1
            pi-graph: '{"@earendil-works/pi-agent-core":"0.85.1","@earendil-works/pi-ai":"0.85.1","@earendil-works/pi-client":"0.85.1","@earendil-works/pi-coding-agent":"0.85.1","@earendil-works/pi-protocol":"0.85.1","@earendil-works/pi-telemetry":"0.85.1","@earendil-works/pi-tui":"0.85.1"}'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # sourceRevision() must traverse past fixture-only commits.
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ matrix.bun-version }}
      - name: Report selected toolchain
        run: |
          set -euo pipefail
          test "$(bun --version)" = "${{ matrix.bun-version }}"
          bun --version
          command -v cc
          cc --version
      - name: Install locked baseline
        if: matrix.pi-version == ''
        run: bun install --frozen-lockfile
      - name: Install selected Pi compatibility graph
        if: matrix.pi-version != ''
        env:
          PI_GRAPH_EXPECTED: ${{ matrix.pi-graph }}
        run: |
          set -euo pipefail
          cp package.json "$RUNNER_TEMP/package.json.original"
          bun -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            if (typeof pkg !== "object" || pkg === null || Array.isArray(pkg)) throw new Error("invalid package manifest");
            const devDependencies = pkg.devDependencies ?? {};
            if (typeof devDependencies !== "object" || devDependencies === null || Array.isArray(devDependencies)) throw new Error("invalid development dependencies");
            const expected = JSON.parse(process.env.PI_GRAPH_EXPECTED ?? "");
            if (typeof expected !== "object" || expected === null || Array.isArray(expected)) throw new Error("PI_GRAPH_EXPECTED must be a package/version map");
            const entries = Object.entries(expected);
            if (entries.length === 0) throw new Error("PI_GRAPH_EXPECTED must not be empty");
            const piName = /^@earendil-works\/pi-[a-z0-9][a-z0-9._-]*$/;
            const exactVersion = /^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
            for (const [name, version] of entries) {
              if (!piName.test(name) || typeof version !== "string" || !exactVersion.test(version)) throw new Error(`invalid Pi graph entry: ${name}@${String(version)}`);
            }
            for (const name of Object.keys(devDependencies)) if (name.startsWith("@earendil-works/pi-")) delete devDependencies[name];
            for (const [name, version] of entries) devDependencies[name] = version;
            pkg.devDependencies = devDependencies;
            writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          '
          rm -rf node_modules
          bun install --no-save
      - name: Verify complete selected Pi version graph
        env:
          PI_GRAPH_EXPECTED: ${{ matrix.pi-graph }}
        run: bun .github/scripts/verify-pi-graph.ts
      - name: Self-test CI assertion helpers
        run: |
          set -euo pipefail
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="${TMPDIR:-/tmp}" CI=1 PI_GRAPH_EXPECTED='${{ matrix.pi-graph }}' PI_OFFLINE=1 bun .github/scripts/verify-pi-graph.ts --self-test
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="${TMPDIR:-/tmp}" CI=1 PI_GRAPH_EXPECTED='${{ matrix.pi-graph }}' PI_OFFLINE=1 bun .github/scripts/package-smoke.ts --self-test
      - name: Assert installed extension registration without install
        run: env -i PATH="$PATH" HOME="$HOME" TMPDIR="${TMPDIR:-/tmp}" CI=1 PI_GRAPH_EXPECTED='${{ matrix.pi-graph }}' PI_OFFLINE=1 bun .github/scripts/package-smoke.ts --existing
      - name: Type check each core compatibility lane
        if: matrix.stage == 'core'
        run: bun run check
      - name: Run isolated CI stage
        env:
          PI_GRAPH_EXPECTED: ${{ matrix.pi-graph }}
          CI_STAGE_DIAGNOSTICS_DIR: ${{ runner.temp }}/ci-stage-diagnostics
        run: |
          set -euo pipefail
          install -d -m 700 "$CI_STAGE_DIAGNOSTICS_DIR"
          bun .github/scripts/ci-stage.ts "${{ matrix.stage }}" --strict-linux
      - id: validate-stage-diagnostic
        name: Validate exact sanitized stage diagnostic manifest
        if: always()
        run: |
          set -euo pipefail
          report_path="$(bun .github/scripts/ci-stage.ts --validate-diagnostic-dir "$RUNNER_TEMP/ci-stage-diagnostics")"
          case "$report_path" in
            "$RUNNER_TEMP"/ci-stage-diagnostics/ci-stage-*/*.json) ;;
            *) echo "validated report path escaped the owned diagnostics root" >&2; exit 1 ;;
          esac
          printf 'report_path=%s\n' "$report_path" >> "$GITHUB_OUTPUT"
      - name: Upload exact sanitized stage diagnostic
        if: always() && steps.validate-stage-diagnostic.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-stage-${{ matrix.lane }}-${{ matrix.stage }}
          path: ${{ steps.validate-stage-diagnostic.outputs.report_path }}
          if-no-files-found: error
          retention-days: 7
      - name: Inspect package contents
        run: bun pm pack --dry-run
      - name: Tarball install and registration smoke (provider-free)
        run: env -i PATH="$PATH" HOME="$HOME" TMPDIR="${TMPDIR:-/tmp}" CI=1 PI_GRAPH_EXPECTED='${{ matrix.pi-graph }}' PI_OFFLINE=1 bun .github/scripts/package-smoke.ts
      - name: Confirm compatibility install was ephemeral
        if: always() && matrix.pi-version != ''
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/package.json.original"
          mv "$RUNNER_TEMP/package.json.original" package.json
          git diff --exit-code -- package.json bun.lock

  aggregate:
    name: required CI stage aggregate
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix stage to succeed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          case "$VERIFY_RESULT" in
            success) ;;
            failure|cancelled|skipped)
              echo "one or more required core/heavy matrix stages ended: $VERIFY_RESULT" >&2
              exit 1
              ;;
            *)
              echo "unexpected required-stage aggregate result: $VERIFY_RESULT" >&2
              exit 1
              ;;
          esac
